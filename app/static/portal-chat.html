<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your tickets — Support Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F4F1; --surface:#FFFFFF; --surface-2:#FAFAF8; --surface-3:#F2F1ED;
  --ink:#16181C; --ink-2:#5A6069; --ink-3:#8B929B;
  --line:#EAE8E3; --line-2:#E0DDD6;
  --brand:#EF4E2B; --brand-600:#D8401F; --brand-bg:#FEF0EC;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --sh-1:0 1px 2px rgba(16,24,40,.05);
  --sh-2:0 1px 3px rgba(16,24,40,.06), 0 8px 24px -6px rgba(16,24,40,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  min-height:100vh;display:flex;flex-direction:column}

.appbar{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);
  padding:11px 20px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh-1)}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,#FF6B3D,var(--brand) 60%,#D8401F);
  color:#fff;font-weight:800;font-size:13px;letter-spacing:-.02em}
.bname{font-size:15px;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.btag{font-size:10.5px;color:var(--ink-3);font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;margin-top:1px}
.grow{flex:1}
.me{display:flex;align-items:center;gap:9px;padding:4px 5px 4px 4px;
  border:1px solid var(--line);border-radius:999px;background:var(--surface-2)}
.me .av{width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:grid;
  place-items:center;font-size:11px;font-weight:800;color:#fff;
  background:linear-gradient(140deg,#FF6B3D,var(--brand) 60%,#D8401F)}
.me .mn{font-size:12.5px;font-weight:650;line-height:1.2}
.me .mr{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin-top:1px}
.me .out{width:26px;height:26px;border:0;border-radius:50%;background:transparent;
  color:var(--ink-3);cursor:pointer;font-size:13px;transition:.15s}
.me .out:hover{background:var(--surface-3);color:var(--brand)}

main{flex:1;padding:22px 24px 30px;display:flex;justify-content:center;min-height:0}
.wrap{width:100%;max-width:760px;display:flex;flex-direction:column;min-height:0;flex:1}

.strip{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:12px 15px;box-shadow:var(--sh-1);margin-bottom:14px;flex:0 0 auto}
.strip .cid{font-family:var(--mono);font-size:12.5px;font-weight:700}
.strip .subj{font-size:13.5px;font-weight:650;color:var(--ink);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip .grow{flex:1}
.back{height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink-2);font-size:12px;font-weight:650;
  cursor:pointer;font-family:var(--sans);transition:.15s}
.back:hover{border-color:var(--brand);color:var(--brand)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;
  font-size:11.5px;font-weight:700;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.pill.green{background:#E7F5EC;color:#0B8A4B}
.pill.amber{background:#FDF2E0;color:#C97A00}
.pill.grey{background:var(--surface-3);color:var(--ink-3)}

.thread{flex:1;min-height:0;overflow-y:auto;background:var(--surface);
  border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-2);
  padding:20px;display:flex;flex-direction:column;gap:14px}
.turn{max-width:78%;display:flex;flex-direction:column}
.turn.mine{align-self:flex-end;align-items:flex-end}
.turn.theirs{align-self:flex-start}
.who{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:5px}
.bubble{padding:12px 15px;border-radius:15px;font-size:13.5px;line-height:1.6;
  white-space:pre-wrap;word-break:break-word}
.turn.theirs .bubble{background:var(--surface-3);color:var(--ink);
  border-bottom-left-radius:5px}
.turn.mine .bubble{background:linear-gradient(140deg,#FF6B3D,var(--brand) 62%,#D8401F);
  color:#fff;border-bottom-right-radius:5px}
.sysline{align-self:center;max-width:90%;text-align:center;font-size:12px;
  color:#C97A00;background:#FDF2E0;border:1px solid #F3DDB4;border-radius:999px;
  padding:6px 14px;font-weight:600}

/* ---------- rating ---------- */
.rate{flex:0 0 auto;margin-top:14px;background:var(--surface);
  border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-1);
  padding:16px 18px}
.rate.done{background:#E7F5EC;border-color:#BFE3CD}
.rate h3{font-size:14px;font-weight:750;letter-spacing:-.01em;margin-bottom:3px}
.rate .sub{font-size:12.5px;color:var(--ink-3);margin-bottom:13px}
.stars{display:flex;gap:5px;margin-bottom:12px}
.star{width:38px;height:38px;border-radius:11px;border:1px solid var(--line-2);
  background:var(--surface-2);cursor:pointer;font-size:19px;line-height:1;
  display:grid;place-items:center;transition:.14s;color:var(--ink-3)}
.star:hover{border-color:#F0A88F;transform:translateY(-1px)}
.star.on{background:#FFF6E5;border-color:#F0C674;color:#E8A317}
.rate textarea{width:100%;min-height:62px;resize:vertical;padding:10px 12px;
  border-radius:11px;border:1px solid var(--line-2);background:var(--surface-2);
  color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.55;
  outline:none;transition:.15s;margin-bottom:11px}
.rate textarea:focus{border-color:#F0A88F;background:var(--surface);
  box-shadow:0 0 0 3.5px rgba(239,78,43,.11)}
.rate .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rate .msg{font-size:12.5px;color:var(--ink-2)}
.rate .err{color:#D6382F;font-weight:600}
.given{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.given .shown{font-size:19px;letter-spacing:2px;color:#E8A317}
.given .words{font-size:13px;color:var(--ink-2);font-style:italic}
.linkish{background:none;border:0;padding:0;color:var(--brand);font-size:12.5px;
  font-weight:650;cursor:pointer;font-family:var(--sans);text-decoration:underline}

.composer{flex:0 0 auto;margin-top:14px;display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;min-height:44px;max-height:140px;resize:none;padding:12px 14px;
  border-radius:13px;border:1px solid var(--line-2);background:var(--surface);
  color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.55;
  outline:none;transition:.15s}
textarea:focus{border-color:#F0A88F;box-shadow:0 0 0 3.5px rgba(239,78,43,.11)}
.send{height:44px;padding:0 20px;border-radius:13px;border:0;cursor:pointer;
  background:linear-gradient(140deg,#FF6B3D,var(--brand) 62%,#D8401F);color:#fff;
  font-family:var(--sans);font-size:13.5px;font-weight:700;transition:.15s;
  box-shadow:0 1px 2px rgba(216,64,31,.28),0 8px 20px -8px rgba(216,64,31,.5)}
.send:hover{filter:brightness(1.05)}
.send:disabled{opacity:.55;cursor:not-allowed}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;display:inline-block;animation:sp .7s linear infinite;
  vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
.thinking{align-self:flex-start;font-size:12.5px;color:var(--ink-3);padding:4px 2px}
</style>
</head>
<body>

<div class="appbar">
  <div class="brand">
    <div class="logo">SC</div>
    <div>
      <div class="bname">Support Coach</div>
      <div class="btag">Your tickets</div>
    </div>
  </div>
  <div class="grow"></div>
  <div class="me" id="me" hidden>
    <span class="av" id="meAv">?</span>
    <span>
      <span class="mn" id="meName">&mdash;</span>
      <span class="mr" id="meRole">&mdash;</span>
    </span>
    <button class="out" id="signOut" title="Sign out" aria-label="Sign out">&#9211;</button>
  </div>
</div>

<main>
  <div class="wrap">
    <div class="strip">
      <button class="back" id="backBtn">&larr; All tickets</button>
      <span class="cid" id="cid">&mdash;</span>
      <span class="subj" id="subj"></span>
      <span class="grow"></span>
      <span class="pill grey" id="statePill"><i></i><span id="stateLabel">&mdash;</span></span>
    </div>

    <div class="thread" id="thread"></div>

    <div class="rate" id="rateCard" hidden></div>

    <div class="composer">
      <textarea id="input" rows="1" placeholder="Type your message&hellip;"></textarea>
      <button class="send" id="sendBtn">Send</button>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const CASE_ID = location.pathname.split("/").filter(Boolean).pop();
let busy = false;

/* Everything on this page comes from as_customer_case(). There is no field
   here for sentiment, risk, gates, scores or lookups, because the server
   never sends one. */
function render(t){
  $("cid").textContent = t.id;
  $("subj").textContent = t.subject;
  $("stateLabel").textContent = t.status_label;
  $("statePill").className = "pill " + t.status_tone;

  const thread = $("thread");
  thread.innerHTML = "";

  (t.messages || []).forEach(m => {
    const mine = m.speaker === "customer";
    const turn = document.createElement("div");
    turn.className = "turn " + (mine ? "mine" : "theirs");

    const who = document.createElement("div");
    who.className = "who";
    who.textContent = m.from;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = m.text;      // the customer's own words, as text

    turn.appendChild(who);
    turn.appendChild(bubble);
    thread.appendChild(turn);
  });

  // A human is coming. Shown when the ticket is with a person and the last
  // thing said was the customer's -- i.e. nothing answered them yet.
  const msgs = t.messages || [];
  const last = msgs[msgs.length - 1];
  if(t.status === "human_reviewing" && last && last.speaker === "customer"){
    const line = document.createElement("div");
    line.className = "sysline";
    line.textContent = "A human agent is joining this conversation";
    thread.appendChild(line);
  }

  thread.scrollTop = thread.scrollHeight;
  renderRating(t);
}

let picked = 0;

/* Only ever shown on a closed ticket. The server decides that -- can_rate --
   so this page never has to reason about statuses it should not know. */
function renderRating(t){
  const card = $("rateCard");
  if(!t.can_rate){ card.hidden = true; return; }
  card.hidden = false;

  // Already rated and the window has closed: show it, read only.
  if(t.rating && !t.rating_editable){
    card.className = "rate done";
    card.innerHTML = `<h3>Thanks for rating this</h3>
      <div class="given">
        <span class="shown">${"★".repeat(t.rating)}${"☆".repeat(5 - t.rating)}</span>
        <span class="words" data-words></span>
      </div>`;
    card.querySelector("[data-words]").textContent = t.rating_comment || "";
    return;
  }

  const rated = Boolean(t.rating);
  picked = t.rating || 0;
  card.className = "rate" + (rated ? " done" : "");
  card.innerHTML = `
    <h3>${rated ? "Thanks — you rated this" : "Was your issue resolved?"}</h3>
    <div class="sub">${rated
      ? "You can change this for 24 hours after rating."
      : "Tell us how it went. One tap, and a line if you want to."}</div>
    <div class="stars" id="stars" role="group" aria-label="Rate from 1 to 5">
      ${[1,2,3,4,5].map(n => `<button type="button" class="star" data-n="${n}"
          aria-label="${n} star${n === 1 ? "" : "s"}">★</button>`).join("")}
    </div>
    <textarea id="rateNote" maxlength="280"
      placeholder="Anything you want to add? (optional)"></textarea>
    <div class="row">
      <button class="send" id="rateSend" style="height:36px;padding:0 16px;
        font-size:12.5px">${rated ? "Update rating" : "Send rating"}</button>
      <span class="msg" id="rateMsg"></span>
    </div>`;

  $("rateNote").value = t.rating_comment || "";
  paintStars();

  card.querySelectorAll(".star").forEach(b => {
    b.onclick = () => { picked = Number(b.dataset.n); paintStars(); };
  });
  $("rateSend").onclick = sendRating;
}

function paintStars(){
  document.querySelectorAll("#stars .star").forEach(b =>
    b.classList.toggle("on", Number(b.dataset.n) <= picked));
}

async function sendRating(){
  const msg = $("rateMsg");
  msg.className = "msg";
  if(!picked){
    msg.className = "msg err";
    msg.textContent = "Pick a star first.";
    return;
  }

  $("rateSend").disabled = true;
  msg.textContent = "Sending…";
  try{
    const d = await (await fetch(`/api/portal/cases/${CASE_ID}/rating`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({score: picked, comment: $("rateNote").value.trim()}),
    })).json();

    if(!d.ok){
      msg.className = "msg err";
      msg.textContent = d.error || "Could not save that.";
      $("rateSend").disabled = false;
      return;
    }
    render(d.ticket);            // repaints the card in its "rated" state
  }catch(e){
    msg.className = "msg err";
    msg.textContent = "Could not reach the server.";
    $("rateSend").disabled = false;
  }
}

async function load(){
  try{
    const d = await (await fetch("/api/portal/cases/" + CASE_ID)).json();
    if(!d.ok){ location.href = "/portal?error=not-your-ticket"; return; }
    render(d.ticket);
  }catch(e){ /* keep what is on screen */ }
}

async function send(){
  const text = $("input").value.trim();
  if(busy || !text) return;

  busy = true;
  $("sendBtn").disabled = true;
  $("sendBtn").innerHTML = '<span class="spin"></span>Sending';
  $("input").value = "";
  $("input").style.height = "auto";

  const waiting = document.createElement("div");
  waiting.className = "thinking";
  waiting.textContent = "Looking at this…";
  $("thread").appendChild(waiting);
  $("thread").scrollTop = $("thread").scrollHeight;

  try{
    const d = await (await fetch(`/api/portal/cases/${CASE_ID}/message`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text}),
    })).json();
    if(d.ok) render(d.ticket); else await load();
  }catch(e){ await load(); }

  busy = false;
  $("sendBtn").disabled = false;
  $("sendBtn").textContent = "Send";
  $("input").focus();
}

$("sendBtn").onclick = send;
$("backBtn").onclick = () => { location.href = "/portal"; };
$("input").addEventListener("input", e => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 140) + "px";
});
$("input").addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});

(async () => {
  try{
    const me = await (await fetch("/api/me")).json();
    if(me && me.ok){
      const u = me.user;
      $("meName").textContent = u.display_name;
      $("meRole").textContent = u.role;
      $("meAv").textContent = (u.display_name || u.username).trim()[0].toUpperCase();
      $("me").hidden = false;
    }
  }catch(e){}
  await load();
  $("input").focus();
})();

$("signOut").onclick = async () => {
  await fetch("/api/logout", {method: "POST"}).catch(() => {});
  location.href = "/login";
};
</script>
</body>
</html>
