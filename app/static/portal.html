<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your tickets — Support Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F4F1; --surface:#FFFFFF; --surface-2:#FAFAF8; --surface-3:#F2F1ED;
  --ink:#16181C; --ink-2:#5A6069; --ink-3:#8B929B;
  --line:#EAE8E3; --line-2:#E0DDD6;
  --brand:#EF4E2B; --brand-600:#D8401F; --brand-bg:#FEF0EC;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --sh-1:0 1px 2px rgba(16,24,40,.05);
  --sh-2:0 1px 3px rgba(16,24,40,.06), 0 8px 24px -6px rgba(16,24,40,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  min-height:100vh;display:flex;flex-direction:column}

.appbar{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);
  padding:11px 20px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh-1)}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,#FF6B3D,var(--brand) 60%,#D8401F);
  color:#fff;font-weight:800;font-size:13px;letter-spacing:-.02em}
.bname{font-size:15px;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.btag{font-size:10.5px;color:var(--ink-3);font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;margin-top:1px}
.grow{flex:1}
.me{display:flex;align-items:center;gap:9px;padding:4px 5px 4px 4px;
  border:1px solid var(--line);border-radius:999px;background:var(--surface-2)}
.me .av{width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:grid;
  place-items:center;font-size:11px;font-weight:800;color:#fff;
  background:linear-gradient(140deg,#FF6B3D,var(--brand) 60%,#D8401F)}
.me .mn{font-size:12.5px;font-weight:650;line-height:1.2}
.me .mr{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin-top:1px}
.me .out{width:26px;height:26px;border:0;border-radius:50%;background:transparent;
  color:var(--ink-3);cursor:pointer;font-size:13px;transition:.15s}
.me .out:hover{background:var(--surface-3);color:var(--brand)}

main{flex:1;padding:34px 24px 60px;display:flex;justify-content:center}
.wrap{width:100%;max-width:960px}

.vhead{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.vtitle{font-size:24px;font-weight:800;letter-spacing:-.035em}
.vsub{font-size:13px;color:var(--ink-3);margin-top:4px}
.grow{flex:1}
.btn{height:40px;padding:0 18px;border-radius:11px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink-2);font-family:var(--sans);font-size:13px;
  font-weight:650;cursor:pointer;transition:.15s;box-shadow:var(--sh-1)}
.btn:hover{background:var(--surface-2);color:var(--ink)}
.btn.brand{background:linear-gradient(140deg,#FF6B3D,var(--brand) 62%,#D8401F);
  border-color:transparent;color:#fff;box-shadow:0 1px 2px rgba(216,64,31,.28),
  0 8px 20px -8px rgba(216,64,31,.5)}
.btn.brand:hover{filter:brightness(1.05);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--sh-2);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);padding:13px 16px;
  border-bottom:1px solid var(--line);background:var(--surface-2)}
tbody td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:13.5px;
  vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.cid{font-family:var(--mono);font-size:12px;font-weight:700}
.subj{font-weight:600;color:var(--ink)}
.cat{font-size:12px;color:var(--ink-2)}
.when{font-size:12px;color:var(--ink-3);font-family:var(--mono)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;
  font-size:11.5px;font-weight:700;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.pill.green{background:var(--green-bg,#E7F5EC);color:#0B8A4B}
.pill.amber{background:#FDF2E0;color:#C97A00}
.pill.grey{background:var(--surface-3);color:var(--ink-3)}

.empty{padding:56px 30px;text-align:center}
.empty .ico{width:60px;height:60px;border-radius:18px;margin:0 auto 18px;display:grid;
  place-items:center;font-size:26px;background:var(--brand-bg)}
.empty h2{font-size:18px;font-weight:750;letter-spacing:-.02em;margin-bottom:8px}
.empty p{font-size:13.5px;color:var(--ink-2);line-height:1.65;margin-bottom:22px}

.scrim{position:fixed;inset:0;background:rgba(22,24,28,.36);z-index:40;
  display:grid;place-items:center;padding:20px;animation:fade .16s ease-out}
/* display:grid above beats the UA's [hidden]{display:none} -- same
   specificity, declared later -- so the closed modal stayed on top of the
   page as an invisible sheet and swallowed every click on the table. */
.scrim[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-width:520px;background:var(--surface);border-radius:20px;
  box-shadow:0 24px 60px -12px rgba(16,24,40,.3);overflow:hidden;
  animation:rise .2s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{transform:translateY(10px);opacity:.6}}
.mhead{padding:20px 22px 0}
.mhead h2{font-size:18px;font-weight:800;letter-spacing:-.025em}
.mhead p{font-size:12.5px;color:var(--ink-3);margin-top:5px}
.mbody{padding:18px 22px 4px}
.field{margin-bottom:15px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border-radius:11px;
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);
  font-family:var(--sans);font-size:13.5px;outline:none;transition:.15s}
.field textarea{min-height:104px;resize:vertical;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:#F0A88F;background:var(--surface);box-shadow:0 0 0 3.5px rgba(239,78,43,.11)}
.mfoot{padding:14px 22px 20px;display:flex;gap:9px;justify-content:flex-end;
  border-top:1px solid var(--line);margin-top:14px}
.err{background:#FCEDEB;color:#D6382F;border-radius:11px;padding:10px 13px;
  font-size:12.5px;font-weight:600;margin-bottom:14px}

.done{padding:40px 30px;text-align:center}
.done .tick{width:56px;height:56px;border-radius:50%;margin:0 auto 18px;display:grid;
  place-items:center;font-size:24px;background:#E7F5EC;color:#0B8A4B}
.done h2{font-size:18px;font-weight:750;margin-bottom:7px}
.done .cid{display:inline-block;margin:10px 0 6px;font-size:15px}
.done p{font-size:13.5px;color:var(--ink-2)}
.notice{background:#FDF2E0;color:#C97A00;border:1px solid #F3DDB4;border-radius:12px;
  padding:11px 14px;font-size:12.5px;font-weight:600;margin-bottom:18px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;display:inline-block;animation:sp .7s linear infinite;
  vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="appbar">
  <div class="brand">
    <div class="logo">SC</div>
    <div>
      <div class="bname">Support Coach</div>
      <div class="btag">Your tickets</div>
    </div>
  </div>
  <div class="grow"></div>
  <div class="me" id="me" hidden>
    <span class="av" id="meAv">?</span>
    <span>
      <span class="mn" id="meName">&mdash;</span>
      <span class="mr" id="meRole">&mdash;</span>
    </span>
    <button class="out" id="signOut" title="Sign out" aria-label="Sign out">&#9211;</button>
  </div>
</div>

<main>
  <div class="wrap">
    <div class="notice" id="notice" hidden></div>

    <div class="vhead">
      <div>
        <div class="vtitle">Your tickets</div>
        <div class="vsub" id="vsub">&nbsp;</div>
      </div>
      <div class="grow"></div>
      <button class="btn brand" id="newBtn">New support request</button>
    </div>

    <div id="listWrap"></div>
  </div>
</main>

<div class="scrim" id="scrim" hidden>
  <div class="modal" id="modal">
    <div id="formView">
      <div class="mhead">
        <h2>New support request</h2>
        <p>Tell us what happened and we will look at it straight away.</p>
      </div>
      <form id="form">
        <div class="mbody">
          <div class="err" id="err" hidden></div>
          <div class="field">
            <label for="subject">Subject</label>
            <input id="subject" maxlength="120" placeholder="Recharge failed but money was deducted" required>
          </div>
          <div class="field">
            <label for="category">Category</label>
            <select id="category"></select>
          </div>
          <div class="field">
            <label for="description">What happened</label>
            <textarea id="description" placeholder="Describe the problem in your own words." required></textarea>
          </div>
        </div>
        <div class="mfoot">
          <button type="button" class="btn" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn brand" id="submitBtn">Raise ticket</button>
        </div>
      </form>
    </div>

    <div class="done" id="doneView" hidden>
      <div class="tick">&#10003;</div>
      <h2>Ticket created</h2>
      <div class="cid" id="doneId">&mdash;</div>
      <p>We&rsquo;re looking at this now.</p>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let CATEGORIES = [];

function when(iso){
  if(!iso) return "—";
  const then = new Date(iso), mins = Math.round((Date.now() - then) / 60000);
  if(mins < 1)  return "just now";
  if(mins < 60) return mins + "m ago";
  const h = Math.floor(mins / 60);
  if(h < 24) return h + "h ago";
  return Math.floor(h / 24) + "d ago";
}

/* The server decides the three states; this only paints them. Nothing about
   risk, sentiment or scores ever reaches this page. */
function render(tickets){
  $("vsub").textContent = tickets.length
    ? `${tickets.length} ticket${tickets.length === 1 ? "" : "s"}`
    : " ";

  if(!tickets.length){
    $("listWrap").innerHTML = `<div class="panel"><div class="empty">
      <div class="ico">&#127915;</div>
      <h2>No tickets yet</h2>
      <p>Raise your first one and we will pick it up straight away.</p>
      <button class="btn brand" id="emptyNew">New support request</button>
    </div></div>`;
    $("emptyNew").onclick = openModal;
    return;
  }

  $("listWrap").innerHTML = `<div class="panel"><table>
    <thead><tr>
      <th>Ticket</th><th>Subject</th><th>Category</th>
      <th>Status</th><th>Last updated</th><th></th>
    </tr></thead>
    <tbody>${tickets.map((t,i) => `
      <tr>
        <td><span class="cid">${t.id}</span></td>
        <td class="subj" data-s="${i}"></td>
        <td class="cat" data-c="${i}"></td>
        <td><span class="pill ${t.status_tone}"><i></i><span data-l="${i}"></span></span></td>
        <td class="when">${when(t.updated_at)}</td>
        <td style="text-align:right"><button class="btn" data-open="${t.id}">Open</button></td>
      </tr>`).join("")}</tbody></table></div>`;

  // Text set separately: a subject is the customer's own words.
  tickets.forEach((t,i) => {
    document.querySelector(`[data-s="${i}"]`).textContent = t.subject;
    document.querySelector(`[data-c="${i}"]`).textContent = t.category;
    document.querySelector(`[data-l="${i}"]`).textContent = t.status_label;
  });
  document.querySelectorAll("[data-open]").forEach(b => {
    b.onclick = () => { location.href = "/portal/chat/" + b.dataset.open; };
  });
}

async function load(){
  try{
    const d = await (await fetch("/api/portal/tickets")).json();
    if(!d.ok) return;
    CATEGORIES = d.categories || [];
    $("category").innerHTML = CATEGORIES.map(c =>
      `<option value="${c}">${c}</option>`).join("");
    render(d.tickets || []);
  }catch(e){ /* leave whatever is on screen */ }
}

function openModal(){
  $("err").hidden = true;
  $("formView").hidden = false;
  $("doneView").hidden = true;
  $("scrim").hidden = false;
  $("subject").focus();
}
function closeModal(){ $("scrim").hidden = true; $("form").reset(); }

$("newBtn").onclick = openModal;
$("cancelBtn").onclick = closeModal;
$("scrim").onclick = e => { if(e.target === $("scrim")) closeModal(); };
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && !$("scrim").hidden) closeModal();
});

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  $("err").hidden = true;
  $("submitBtn").disabled = true;
  $("submitBtn").innerHTML = '<span class="spin"></span>Raising…';

  let d;
  try{
    d = await (await fetch("/api/portal/tickets", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        subject: $("subject").value.trim(),
        category: $("category").value,
        description: $("description").value.trim(),
      }),
    })).json();
  }catch(err){ d = {ok: false, error: "Could not reach the server."}; }

  $("submitBtn").disabled = false;
  $("submitBtn").textContent = "Raise ticket";

  if(!d.ok){
    $("err").textContent = d.error || "Could not raise that ticket.";
    $("err").hidden = false;
    return;
  }

  // The case id and a plain reassurance. No risk score, no analysis.
  $("doneId").textContent = d.ticket.id;
  $("formView").hidden = true;
  $("doneView").hidden = false;
  setTimeout(() => { location.href = "/portal/chat/" + d.ticket.id; }, 2000);
});

(async () => {
  const params = new URLSearchParams(location.search);
  if(params.get("error") === "not-your-ticket"){
    $("notice").textContent = "That ticket is not yours. Here are your own.";
    $("notice").hidden = false;
  }

  try{
    const me = await (await fetch("/api/me")).json();
    if(me && me.ok){
      const u = me.user;
      $("meName").textContent = u.display_name;
      $("meRole").textContent = u.role;
      $("meAv").textContent = (u.display_name || u.username).trim()[0].toUpperCase();
      $("me").hidden = false;
      $("vsub").textContent = "Welcome back, " + (u.display_name || u.username);
    }
  }catch(e){}

  await load();
})();

$("signOut").onclick = async () => {
  await fetch("/api/logout", {method: "POST"}).catch(() => {});
  location.href = "/login";
};
</script>
</body>
</html>
