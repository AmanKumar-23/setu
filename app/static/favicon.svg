<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"
     role="img" aria-label="Setu">
  <title>Setu</title>
  <defs>
    <linearGradient id="setu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B3D"/>
      <stop offset=".55" stop-color="#EF4E2B"/>
      <stop offset="1" stop-color="#D8401F"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="19" fill="url(#setu)"/>
  <!-- Real text, not a path: it stays a letter at every size, and any system
       with a Devanagari face renders it. The PNG beside this file covers the
       ones that do not. -->
  <text x="32" y="33" fill="#fff" font-size="38" font-weight="700"
        text-anchor="middle" dominant-baseline="central"
        font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Devanagari Sangam MN','Mangal',sans-serif"
        >&#2360;&#2375;</text>
</svg>
