<svg xmlns="http://www.w3.org/2000/svg" width="560" height="140" viewBox="0 0 560 140"
     role="img" aria-label="सेतु · Setu">
  <title>सेतु · Setu</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B3D"/>
      <stop offset="1" stop-color="#D8401F"/>
    </linearGradient>
  </defs>

  <!-- The mark: से, the first letter of सेतु — a bridge. -->
  <rect x="10" y="18" width="104" height="104" rx="30" fill="url(#g)"/>
  <text x="62" y="72" fill="#fff" font-size="62" font-weight="700"
        text-anchor="middle" dominant-baseline="central"
        font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Devanagari Sangam MN','Mangal',sans-serif"
        >से</text>

  <text x="140" y="70" font-size="44" font-weight="700" fill="#16130F"
        font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Devanagari Sangam MN','Mangal','Segoe UI',Inter,system-ui,sans-serif"
        >सेतु</text>
  <text x="222" y="70" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif"
        font-size="44" font-weight="700" fill="#16130F">· Setu</text>
  <text x="142" y="102" font-family="'SF Mono',Menlo,Consolas,monospace"
        font-size="17" letter-spacing="1.5" fill="#8A817A">AI WHERE IT'S SAFE. HUMAN WHERE IT MATTERS.</text>
</svg>
